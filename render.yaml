# Render Blueprint: New -> Blueprint -> select this repo.
databases:
  - name: services-db
    plan: free            # free Postgres expires after ~30 days; upgrade to a paid plan before launch
    databaseName: app
    user: app

services:
  - type: web
    name: services-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free            # free web services sleep when idle; use a paid plan for production
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: services-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false       # set in dashboard: https://your-app.vercel.app,https://yourdomain.com
      - key: APP_ENV
        value: production  # disables the mock payment provider
      - key: PUBLIC_API_URL
        sync: false        # https://api.yourdomain.com  (payment callback is built from this)
      - key: PAYMENT_PROVIDER
        value: zarinpal    # use "none" to disable online payment (manual confirmation still works)
      - key: ZARINPAL_MERCHANT_ID
        sync: false
      - key: ZARINPAL_SANDBOX
        value: "false"
      - key: S3_ENDPOINT_URL
        sync: false        # R2: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false        # receives contact-form messages (needs RESEND_API_KEY); optional
      - key: PUBLIC_SITE_URL
        sync: false       # https://yourdomain.com (used in email links)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false       # e.g. Services <noreply@yourdomain.com> (domain verified in Resend)
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        generateValue: true
      - key: OLLAMA_BASE_URL
        sync: false       # set in dashboard: your tunnel/VPS URL
      - key: OLLAMA_MODEL_DEFAULT
        value: qwen2.5:7b
      - key: OLLAMA_MODEL_LONG
        value: qwen2.5:14b
